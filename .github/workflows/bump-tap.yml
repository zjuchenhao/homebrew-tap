name: Bump tap packages

# Generic updater for every cask and formula in this tap.
# Detection is driven by each package's own `livecheck` block
# (see README for the convention), so new packages need no changes here.

on:
  schedule:
    # Every 3 hours, like Homebrew's BrewTestBot. Pick a non-round minute
    # to spread GitHub Actions load.
    - cron: "23 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: bump-tap
  cancel-in-progress: false

jobs:
  bump:
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      # Used by brew for GitHub API calls and git push auth (--no-fork).
      HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
      HOMEBREW_GIT_NAME: "github-actions[bot]"
      HOMEBREW_GIT_EMAIL: "41898282+github-actions[bot]@users.noreply.github.com"
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - name: Detect outdated packages
        run: |
          set -euo pipefail

          # The GitHub repo is zjuchenhao/homebrew-tap; the Homebrew tap name
          # is zjuchenhao/tap (brew strips the "homebrew-" prefix).
          brew tap zjuchenhao/tap
          # Custom taps are untrusted by default; trust ours so casks can load.
          brew trust zjuchenhao/tap

          # --newer-only: JSON only contains packages whose livecheck reports
          # a newer version (plus any livecheck errors).
          brew livecheck --tap=zjuchenhao/tap --newer-only --json \
            > /tmp/livecheck.json || true

          python3 - <<'PY' > /tmp/to-bump.txt
          import json

          TAP = "zjuchenhao/tap"

          with open("/tmp/livecheck.json", encoding="utf-8") as f:
              data = json.load(f)

          for item in data:
              kind = "cask" if "cask" in item else "formula"
              name = item[kind]
              if "/" not in name:
                  name = f"{TAP}/{name}"
              if item.get("status") == "error":
                  print(f"::warning::livecheck error for {name}: {item.get('messages')}")
                  continue
              if not item.get("meta", {}).get("livecheck_defined"):
                  print(f"::warning::{name} has no livecheck block; add one to enable auto-bump")
                  continue
              print(kind, name, item["version"]["latest"])
          PY

          if [ -s /tmp/to-bump.txt ]; then
            echo "outdated packages:" && cat /tmp/to-bump.txt
          else
            echo "all packages up to date"
          fi

      - name: Open bump pull requests
        run: |
          set -uo pipefail
          failed=0
          while read -r kind name latest; do
            [ -n "$kind" ] || continue
            echo "== bumping $kind $name -> $latest"
            if [ "$kind" = "cask" ]; then
              out=$(brew bump-cask-pr --no-fork --no-audit --no-style --no-browse \
                    --version "$latest" "$name" 2>&1) || {
                if echo "$out" | grep -qi "duplicate"; then
                  echo "SKIP (PR already open): $name"
                else
                  echo "$out"
                  echo "FAILED: $name"
                  failed=1
                fi
              }
            else
              out=$(brew bump-formula-pr --no-fork --no-audit --no-style --no-browse \
                    --version "$latest" "$name" 2>&1) || {
                if echo "$out" | grep -qi "duplicate"; then
                  echo "SKIP (PR already open): $name"
                else
                  echo "$out"
                  echo "FAILED: $name"
                  failed=1
                fi
              }
            fi
          done < /tmp/to-bump.txt
          exit $failed
