name: Bump tap packages

# Direct-commit updater for every package in this tap.
# Detection is driven by each package's own `livecheck` block
# (see README for the convention), so new packages need no changes here.
# Updates are committed straight to main (no PR): `brew bump-cask-pr
# --write-only` re-downloads the artifact to verify the URL and checksum
# before writing the file, so the change is validated by build time.

on:
  schedule:
    # Every 3 hours, like Homebrew's BrewTestBot. Pick a non-round minute
    # to spread GitHub Actions load.
    - cron: "23 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bump-tap
  cancel-in-progress: false

jobs:
  bump:
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      # Used by Homebrew for GitHub API calls (livecheck rate limits).
      HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
      HOMEBREW_GIT_NAME: "github-actions[bot]"
      HOMEBREW_GIT_EMAIL: "41898282+github-actions[bot]@users.noreply.github.com"
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - name: Bump outdated packages directly on main
        run: |
          set -euo pipefail

          # The GitHub repo is zjuchenhao/homebrew-tap; the Homebrew tap name
          # is zjuchenhao/tap (brew strips the "homebrew-" prefix).
          brew tap zjuchenhao/tap
          # Custom taps are untrusted by default; trust ours so casks can load.
          brew trust zjuchenhao/tap
          TAP_DIR="$(brew --repository zjuchenhao/tap)"

          git -C "$TAP_DIR" config user.name "$HOMEBREW_GIT_NAME"
          git -C "$TAP_DIR" config user.email "$HOMEBREW_GIT_EMAIL"

          # JSON contains every package in the tap (plus any livecheck errors).
          brew livecheck --tap=zjuchenhao/tap --json \
            > /tmp/livecheck.json || true

          python3 - <<'PY' > /tmp/to-bump.txt
          import json, sys

          TAP = "zjuchenhao/tap"

          with open("/tmp/livecheck.json", encoding="utf-8") as f:
              data = json.load(f)

          for item in data:
              kind = "cask" if "cask" in item else "formula"
              name = item[kind]
              if "/" not in name:
                  name = f"{TAP}/{name}"
              if item.get("status") == "error":
                  print(f"::warning::livecheck error for {name}: {item.get('messages')}", file=sys.stderr)
                  continue
              v = item["version"]
              # Summary goes to stderr (log only); bump lines to stdout (to-bump.txt).
              print(f"{name}: {v['current']} ==> {v['latest']}", file=sys.stderr)
              if v.get("outdated"):
                  print(kind, name, v["latest"])
          PY

          if [ ! -s /tmp/to-bump.txt ]; then
            echo "all packages up to date"
            exit 0
          fi
          echo "outdated packages:"
          cat /tmp/to-bump.txt

          failed=0
          while read -r kind name latest; do
            echo "== bumping $kind $name -> $latest"
            if [ "$kind" = "cask" ]; then
              if ! brew bump-cask-pr --write-only --commit --no-audit --no-style \
                    --version "$latest" "$name"; then
                echo "FAILED: $name"
                failed=1
              fi
            else
              # NOTE: bump-formula-pr has no --no-style flag.
              if ! brew bump-formula-pr --write-only --commit --no-audit \
                    --version "$latest" "$name"; then
                echo "FAILED: $name"
                failed=1
              fi
            fi
          done < /tmp/to-bump.txt

          # Push every bump committed above straight to main (no PR, no review).
          git -C "$TAP_DIR" remote set-url origin \
            "https://x-access-token:${HOMEBREW_GITHUB_API_TOKEN}@github.com/zjuchenhao/homebrew-tap.git"
          git -C "$TAP_DIR" push origin main

          exit $failed
