name: Bump TokenRemain cask

on:
  schedule:
    # Hourly; pick a non-round minute to spread GitHub Actions load.
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Check upstream release and update cask
        id: bump
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Latest release tag from the upstream repo (unauthenticated API calls
          # are rate-limited, so use gh with the workflow token instead).
          tag=$(gh api repos/Carstin520/token-remain/releases/latest --jq .tag_name)
          echo "upstream latest release tag: $tag"

          python3 - "$tag" <<'PY'
          import re, sys, urllib.request

          CASK = "Casks/tokenremain.rb"
          UPSTREAM = "Carstin520/token-remain"
          tag = sys.argv[1]

          text = open(CASK, encoding="utf-8").read()
          cur_version = re.search(r'version "([^"]+)"', text).group(1)
          cur_sha = re.search(r'sha256 "([0-9a-f]{64})"', text).group(1)
          print(f"current: version={cur_version} sha256={cur_sha}")

          sums_url = f"https://github.com/{UPSTREAM}/releases/download/{tag}/SHA256SUMS.txt"
          with urllib.request.urlopen(sums_url) as resp:
              sums = resp.read().decode()

          # Find the versioned dmg entry, e.g. "TokenRemain-1.3.7-34.dmg"
          match = None
          for line in sums.splitlines():
              digest, _, name = line.partition(" ")
              name = name.strip().lstrip("*")
              if re.fullmatch(r"TokenRemain-\d+\.\d+\.\d+-\d+\.dmg", name):
                  match = (digest.strip(), name)
                  break
          if match is None:
              raise SystemExit(f"no TokenRemain-<ver>-<build>.dmg entry in {sums_url}")

          new_sha, dmg = match
          ver, _, build = dmg[len("TokenRemain-"):-len(".dmg")].partition("-")
          new_version = f"{ver},{build}"
          print(f"upstream artifact: {dmg} -> version={new_version} sha256={new_sha}")

          if new_version == cur_version and new_sha == cur_sha:
              print("cask is up to date, nothing to do")
              raise SystemExit(0)

          text = re.sub(r'version "[^"]+"', f'version "{new_version}"', text, count=1)
          text = re.sub(r'sha256 "[0-9a-f]{64}"', f'sha256 "{new_sha}"', text, count=1)
          with open(CASK, "w", encoding="utf-8") as f:
              f.write(text)
          print(f"updated {CASK}")
          PY

          if git diff --quiet -- Casks/tokenremain.rb; then
            echo "no cask changes needed"
            exit 0
          fi

          ruby -c Casks/tokenremain.rb

          version=$(sed -n 's/^  version "\(.*\)"/\1/p' Casks/tokenremain.rb)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="bump-tokenremain-$(echo "$version" | tr ',' '-')"
          git checkout -b "$branch"
          git add Casks/tokenremain.rb
          git commit -m "tokenremain: bump to $version"
          git push -u origin "$branch"
          # Ignore failure: a PR may already exist for this branch.
          gh pr create --fill --base main --head "$branch" || true
